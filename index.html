<style>
  :root { --bg: #0d0b09; --ink: #f4ede3; --muted: #b5ab9e; --ember: #ff7a1a; --line: rgba(244, 237, 227, 0.14); color-scheme: dark; }

  a.card:hover, a.card:focus-visible { border-color: var(--ember); outline: none; }
